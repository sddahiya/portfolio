<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="600" viewBox="0 0 1024 600">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="600" fill="url(#bg2)"/>
  
  <!-- Terminal Window -->
  <rect x="40" y="30" width="944" height="540" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  
  <!-- Title Bar -->
  <rect x="40" y="30" width="944" height="38" rx="10" fill="#161b22"/>
  <rect x="40" y="58" width="944" height="10" fill="#161b22"/>
  
  <!-- Window Dots -->
  <circle cx="68" cy="49" r="7" fill="#ff5f57"/>
  <circle cx="90" cy="49" r="7" fill="#febc2e"/>
  <circle cx="112" cy="49" r="7" fill="#28c840"/>
  
  <!-- Title Text -->
  <text x="512" y="54" font-family="monospace" font-size="13" fill="#8b949e" text-anchor="middle">root@rhel9:~ — selinux-hardening-toolkit.sh</text>
  
  <!-- Terminal Content -->
  <text font-family="'Courier New', monospace" font-size="14" fill="#8b949e">
    <!-- Banner -->
    <tspan x="60" y="95" fill="#00ff88">[root@rhel9 ~]#</tspan>
    <tspan fill="#e4e4e7"> ./selinux-hardening-toolkit.sh --audit</tspan>
    
    <tspan x="60" y="120" fill="#ff6b6b">╔══════════════════════════════════════════════════════════════╗</tspan>
    <tspan x="60" y="140" fill="#ff6b6b">║</tspan><tspan fill="#00ff88"> 🛡️  SELinux HARDENING TOOLKIT v1.5                          </tspan><tspan fill="#ff6b6b">║</tspan>
    <tspan x="60" y="160" fill="#ff6b6b">║</tspan><tspan fill="#8b949e">    Mandatory Access Control Enforcement &amp; Audit             </tspan><tspan fill="#ff6b6b">║</tspan>
    <tspan x="60" y="180" fill="#ff6b6b">╚══════════════════════════════════════════════════════════════╝</tspan>
    
    <!-- sestatus -->
    <tspan x="60" y="210" fill="#00ff88">[root@rhel9 ~]#</tspan>
    <tspan fill="#e4e4e7"> sestatus</tspan>
    
    <tspan x="60" y="235" fill="#8b949e">SELinux status:                </tspan><tspan fill="#28c840">enabled</tspan>
    <tspan x="60" y="255" fill="#8b949e">SELinuxfs mount:               /sys/fs/selinux</tspan>
    <tspan x="60" y="275" fill="#8b949e">Current mode:                  </tspan><tspan fill="#28c840">enforcing</tspan>
    <tspan x="60" y="295" fill="#8b949e">Policy version:                </tspan><tspan fill="#e4e4e7">33</tspan>
    <tspan x="60" y="315" fill="#8b949e">Mode from config file:         </tspan><tspan fill="#28c840">enforcing</tspan>

    <!-- semanage -->
    <tspan x="60" y="345" fill="#00ff88">[root@rhel9 ~]#</tspan>
    <tspan fill="#e4e4e7"> semanage boolean -l | grep httpd</tspan>
    
    <tspan x="60" y="370" fill="#a855f7">httpd_can_network_connect</tspan><tspan fill="#8b949e">      (</tspan><tspan fill="#28c840">on</tspan><tspan fill="#8b949e">  ,  </tspan><tspan fill="#28c840">on</tspan><tspan fill="#8b949e">)  Allow httpd network connect</tspan>
    <tspan x="60" y="390" fill="#a855f7">httpd_can_sendmail</tspan><tspan fill="#8b949e">             (</tspan><tspan fill="#ff6b6b">off</tspan><tspan fill="#8b949e"> , </tspan><tspan fill="#ff6b6b">off</tspan><tspan fill="#8b949e">) Allow httpd to send mail</tspan>
    <tspan x="60" y="410" fill="#a855f7">httpd_use_nfs</tspan><tspan fill="#8b949e">                  (</tspan><tspan fill="#ff6b6b">off</tspan><tspan fill="#8b949e"> , </tspan><tspan fill="#ff6b6b">off</tspan><tspan fill="#8b949e">) Allow httpd to use NFS</tspan>

    <!-- audit -->
    <tspan x="60" y="440" fill="#00ff88">[root@rhel9 ~]#</tspan>
    <tspan fill="#e4e4e7"> ausearch -m AVC -ts recent | audit2allow</tspan>
    
    <tspan x="60" y="465" fill="#febc2e">[AUDIT]</tspan><tspan fill="#8b949e"> Analyzing 47 AVC denials from last 24h...</tspan>
    <tspan x="60" y="485" fill="#00d4ff">  allow httpd_t user_home_t:file { read open getattr };</tspan>
    <tspan x="60" y="505" fill="#00d4ff">  allow sshd_t var_log_t:file { write append };</tspan>
    
    <tspan x="60" y="535" fill="#28c840">[✓] Policy: targeted</tspan>
    <tspan x="370" y="535" fill="#28c840">[✓] 14 booleans hardened</tspan>
    <tspan x="660" y="535" fill="#28c840">[✓] 3 custom modules</tspan>
    
    <tspan x="60" y="558" fill="#00ff88">[root@rhel9 ~]#</tspan><tspan fill="#28c840"> _</tspan>
  </text>
</svg>
